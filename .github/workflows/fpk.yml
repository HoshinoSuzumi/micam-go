name: fpk

# 打包飞牛 fnOS 应用（.fpk）。
#
# 手动触发时可以留空 tag，直接取仓库里最新的 tag；也可以指定某个 tag。
# 这个工作流只读仓库，不会创建或推送 tag。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "基于哪个 tag 构建（留空 = 最新的 tag）"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "基于哪个 tag 构建（留空 = 最新的 tag）"
        required: false
        type: string

permissions:
  contents: write # 上传产物到 GitHub Release（不创建 tag）

env:
  GO_VERSION: "1.23"
  FNPACK_VERSION: "1.2.3"

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要能看到所有 tag

      - name: Resolve the tag
        id: ref
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git describe --tags --abbrev=0)
            echo "未指定 tag，使用最新的 $tag"
          fi

          case "$tag" in
          v*) ;;
          *) tag="v$tag" ;;
          esac

          if ! git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::找不到 tag ${tag}"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        run: git checkout "${{ steps.ref.outputs.tag }}"

      - name: Install fnpack
        run: |
          url="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          curl -fsSL -o /usr/local/bin/fnpack "$url"
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the management UI
        # 界面是构建产物，build-fpk.sh 会把它收进包里的 app/www。
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the packages
        # 版本与架构都由脚本写进包里：manifest 的 version 和二进制里注入的版本
        # 都来自这个 tag，和仓库里最后一次提交的数字无关。
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          MICAM_VERSION="$VERSION" ./packaging/build-fpk.sh amd64
          MICAM_VERSION="$VERSION" ./packaging/build-fpk.sh arm64

          mkdir -p dist
          mv -v micam_*.fpk dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: micam-fpk-${{ steps.ref.outputs.version }}
          path: dist/*.fpk
          retention-days: 30

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          # 单独跑本工作流时 release 可能还不存在：建一个草稿，保持和其他产物一致。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "micam $VERSION" --generate-notes
            echo "创建草稿 release $TAG"
          fi

          ls -lh dist
          gh release upload "$TAG" dist/*.fpk --clobber
