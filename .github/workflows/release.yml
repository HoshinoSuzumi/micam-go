name: release

# 手动触发：填版本号即可，工作流会自己创建并推送 tag，然后构建发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号，例如 0.5.0（带不带 v 都行）"
        required: true
        type: string
      latest:
        description: "同时把 latest 指向这个版本"
        required: false
        default: true
        type: boolean
      fpk:
        description: "发布完成后自动打包 fnOS FPK"
        required: false
        default: true
        type: boolean
      draft:
        description: "把 GitHub Release 建成草稿"
        required: false
        default: true
        type: boolean

permissions:
  contents: write # 需要推送 tag
  packages: write # 需要推送镜像

env:
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPO: micam-go

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and create the tag
        id: version
        run: |
          raw="${{ inputs.tag }}"
          version="${raw#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式不对：$raw（期望 0.5.0 这种形式）"
            exit 1
          fi

          tag="v${version}"
          head=$(git rev-parse HEAD)

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            tagged=$(git rev-list -n 1 "$tag")

            if [ "$tagged" = "$head" ]; then
              # 同一次提交上重跑（比如修完工作流再发一次）是安全的：tag 不会移动。
              echo "tag $tag 已指向当前提交 $head，直接复用"
            else
              echo "::error::tag $tag 已存在于 $tagged，当前提交是 $head"
              echo "::error::确认要重发就先删掉它：git push origin :refs/tags/$tag"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "micam $version"
            git push origin "$tag"
            echo "已创建并推送 tag $tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  binary:
    # 静态二进制，不装 Docker 也能直接丢到 NAS 上跑。
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build linux binaries
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/micam-linux-$arch" ./cmd/micam
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: micam-binaries-${{ needs.prepare.outputs.version }}
          path: dist/*
          retention-days: 30

  image:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker Hub 可选：没有 secrets 时只推 ghcr.io。
      - name: Check for Docker Hub credentials
        id: hub
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the image names
        id: names
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          list="${REGISTRY}/${IMAGE_NAME}"
          if [ -n "$USER" ]; then
            list="${list},${USER}/${DOCKERHUB_REPO}"
          fi
          # 仓库路径必须小写；GitHub 的账号与仓库名保留原大小写。
          list=$(printf '%s' "$list" | tr '[:upper:]' '[:lower:]')
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 把二进制挂到 GitHub Release 上。草稿模式方便先检查产物再点发布。
    needs: [prepare, binary]
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes 要在仓库里跑 git 才能找到上一个 tag，
      # 所以这里必须 checkout。放在 download-artifact 之前：checkout 默认会
      # git clean -ffdx，会把已经下载到 dist/ 的产物删掉。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: micam-binaries-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Create the release and upload the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，只补传资产"
          else
            args=(--title "micam $VERSION" --generate-notes)
            if [ "$DRAFT" = "true" ]; then
              args+=(--draft)
              echo "创建草稿 release $TAG"
            else
              echo "创建 release $TAG"
            fi
            gh release create "$TAG" "${args[@]}"
          fi

          ls -l dist
          gh release upload "$TAG" dist/* --clobber

  fpk:
    # 复用 fpk 工作流：比跨工作流 dispatch 可靠，不需要额外 token 权限。
    # 排在 release 之后，保证 fpk 上传时 release 已经存在。
    needs: [prepare, image, release]
    if: ${{ inputs.fpk }}
    uses: ./.github/workflows/fpk.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
