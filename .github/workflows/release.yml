name: release

# Tag a commit to publish:  git tag v0.4.0 && git push origin v0.4.0
# workflow_dispatch builds the same image without publishing a version tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # required to push to ghcr.io with GITHUB_TOKEN

env:
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub 仓库名与 GitHub 仓库名不一定相同（这里就不相同）。
  DOCKERHUB_REPO: micam-go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  binary:
    # A static binary is a useful fallback: it runs on the NAS without Docker at
    # all. Attached to the workflow run, not to a release.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build linux binaries
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/micam-linux-$arch" ./cmd/micam
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: micam-binaries
          path: dist/*
          retention-days: 30

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker Hub is optional. Without the two secrets the image is only pushed
      # to ghcr.io, which needs nothing beyond GITHUB_TOKEN.
      - name: Check for Docker Hub credentials
        id: hub
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the image names
        id: names
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          list="${REGISTRY}/${IMAGE_NAME}"
          if [ -n "$USER" ]; then
            list="${list},${USER}/${DOCKERHUB_REPO}"
          fi
          # Registry paths must be lowercase; GitHub account and repository names
          # keep whatever case their owner chose.
          list=$(printf '%s' "$list" | tr '[:upper:]' '[:lower:]')
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
