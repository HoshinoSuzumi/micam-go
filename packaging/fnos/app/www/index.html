<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>micam</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 30px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 6px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .box {
      display: flex;
      gap: 8px;
    }

    code {
      flex: 1;
      padding: 10px 12px;
      background: #020617;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-x: auto;
      white-space: nowrap;
    }

    button {
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    ul { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
    li { margin: 2px 0; }

    .note {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    a { color: var(--accent); }
  </style>
</head>

<body>
  <main>
    <h1>micam 摄像头取流</h1>
    <p class="sub">MPEG-TS over HTTP，不转码。服务由飞牛应用中心管理，配置在「应用设置」里。</p>

    <label for="url">播放地址</label>
    <div class="box">
      <code id="url">…</code>
      <button id="copy" type="button">复制</button>
    </div>

    <label>播放器</label>
    <ul>
      <li><code>mpv --hwdec=auto &lt;地址&gt;</code></li>
      <li><code>vlc &lt;地址&gt;</code></li>
      <li><code>ffplay -fflags nobuffer &lt;地址&gt;</code></li>
    </ul>

    <p class="note">
      这个流<strong>没有鉴权</strong>，只适合可信网段。想在外面看，请套一层
      Tailscale / WireGuard，或在前面放带认证的反向代理。
      <br />
      画面卡顿但日志正常，多半是播放器软件解码跟不上 2K H.265——换硬件解码即可。
    </p>
  </main>

  <script>
    const url = `http://${location.hostname}:8554/cam.ts`;
    document.getElementById("url").textContent = url;

    document.getElementById("copy").addEventListener("click", async (event) => {
      try {
        await navigator.clipboard.writeText(url);
        event.target.textContent = "已复制";
      } catch {
        event.target.textContent = "复制失败";
      }
      setTimeout(() => { event.target.textContent = "复制"; }, 1500);
    });
  </script>
</body>

</html>
