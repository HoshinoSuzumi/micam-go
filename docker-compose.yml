services:
  micam:
    build: .
    image: micam:latest
    container_name: micam
    restart: unless-stopped
    stop_grace_period: 20s

    # host 网络是默认，也是这里唯一能拿到局域网直连的方式：
    # LAN 搜索发往 255.255.255.255，Docker 的 bridge 不会把它送到物理网段，
    # 摄像头收不到就会静默退回中继。
    # host 模式下不能同时写 ports:，8554 直接开在宿主机上。
    network_mode: host

    environment:
      MICAM_USER: "${MICAM_USER}"
      MICAM_REGION: "${MICAM_REGION:-cn}"
      MICAM_DID: "${MICAM_DID}"

      # 优先用文件而不是环境变量：env 会出现在 docker inspect 里。
      MICAM_PASS_TOKEN_FILE: /run/secrets/pass_token

      MICAM_BIND: 0.0.0.0
      MICAM_PORT: "8554"
      # 实测 xiaomi.camera.92ac1 的 3 才是全分辨率；老机型若花屏改回 2。
      MICAM_QUALITY: "${MICAM_QUALITY:-3}"
      MICAM_PTS_LEAD: "${MICAM_PTS_LEAD:-100}"
      MICAM_RECONNECT: "${MICAM_RECONNECT:-5}"
      MICAM_LAN: "${MICAM_LAN:-prefer}"

    volumes:
      # 凭据与会话；属主必须是 10001（见 Dockerfile），绑定挂载前先 chown。
      - ./data:/data
      # passToken 近似等价于账号密码，只读挂载。
      - ./secrets/pass_token:/run/secrets/pass_token:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 跨网段部署（VPS、摄像头不在同一局域网）时改用 bridge：
#   1. 注释掉上面的 network_mode: host
#   2. 加回 ports: ["8554:8554"]
#   3. 设 MICAM_LAN=off，省掉必然失败的 3 秒广播等待
